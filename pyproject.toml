[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subagent-mcp"
version = "0.1.0"
description = "An MCP server that launches coding-CLI subagents in detached tmux windows."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
subagent-mcp = "subagent_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/subagent_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
